<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · JSuzuki Control</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #09090b; color: #f4f4f5; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .box { max-width: 22rem; text-align: center; }
      .mark { width: 48px; height: 48px; border-radius: 12px; background: #0f9d63; margin: 0 auto 20px; display: grid; place-items: center; }
      h1 { font-size: 1.15rem; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: #8e8e99; }
      button {
        margin-top: 24px; height: 40px; padding: 0 20px; border: 0; border-radius: 12px;
        background: #f4f4f5; color: #09090b; font-size: 0.875rem; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path d="M4 18V9m5 9V5m5 13v-6m5 6V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>JSuzuki Control necesita internet para leer tus datos. Volvé a intentar cuando tengas señal.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
